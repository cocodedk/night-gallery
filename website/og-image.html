<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; overflow:hidden; background:#0C0A07; }
  .field{
    position:relative; width:1200px; height:630px;
    background:#0C0A07;
  }
  .field::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse 80% 70% at 50% 42%, rgba(198,161,91,0.09), transparent 65%),
               radial-gradient(ellipse 120% 100% at 50% 50%, transparent 45%, rgba(0,0,0,0.6) 100%);
  }
  .frame{ position:absolute; top:34px; right:34px; bottom:34px; left:34px; border:1px solid rgba(198,161,91,0.5); }
  .frame::after{ content:''; position:absolute; top:12px; right:12px; bottom:12px; left:12px; border:1px solid rgba(198,161,91,0.18); }
  .content{
    position:relative; z-index:1; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .knight{ font-size:74px; color:#C6A15B; line-height:1; margin-bottom:18px; }
  .title{
    font-family:'Cormorant Garamond', Georgia, serif; font-weight:500;
    font-size:80px; color:#EAE3D2; letter-spacing:0.01em; line-height:1;
  }
  .rule{ width:110px; height:1px; background:#C6A15B; opacity:0.75; margin:26px 0; }
  .tagline{
    font-family:'IBM Plex Sans', 'Segoe UI', sans-serif; font-weight:300;
    font-size:24px; letter-spacing:0.04em; color:#92897A;
  }
  .site{
    position:absolute; bottom:56px; left:0; right:0; text-align:center;
    font-family:'IBM Plex Sans', 'Segoe UI', sans-serif; font-weight:300;
    font-size:17px; letter-spacing:0.22em; text-transform:uppercase; color:#92897A;
    opacity:0.85;
  }
</style>
</head>
<body>
<div class="field">
  <div class="frame"></div>
  <div class="content">
    <div class="knight">&#9822;</div>
    <div class="title">Night Gallery</div>
    <div class="rule"></div>
    <div class="tagline">An ambient learning canvas for your TV</div>
  </div>
  <div class="site">cocode.dk</div>
</div>
</body>
</html>
