<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Gallery — Ambient Learning Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root{
    --ink:        #0C0A07;
    --vellum:     #EAE3D2;
    --brass:      #C6A15B;
    --smoke:      #92897A;
    --board-dark: #2C2721;
    --board-light:#4A4336;
    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --utility: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    --pieces: 'DejaVu Sans', 'Segoe UI Symbol', 'Noto Sans Symbols 2', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:100%; height:100%;
    background:var(--ink);
    color:var(--vellum);
    font-family:var(--utility);
    overflow:hidden;
  }

  body::before{ /* candlelight vignette */
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(ellipse 90% 75% at 50% 42%, rgba(198,161,91,0.055), transparent 65%),
               radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- gilded frame (signature) ---------- */
  #frame{
    position:fixed; inset:1.6vmin; z-index:5; pointer-events:none;
    border:1px solid rgba(198,161,91,0.42);
  }
  #frame::after{
    content:''; position:absolute; inset:0.55vmin;
    border:1px solid rgba(198,161,91,0.14);
  }

  #clock{
    position:fixed; top:3.2vmin; right:4vmin; z-index:6;
    font-family:var(--utility); font-weight:300;
    font-size:2.2vmin; letter-spacing:0.28em; color:var(--smoke);
  }

  #progress{
    position:fixed; left:1.6vmin; right:1.6vmin; bottom:1.6vmin; height:2px; z-index:6;
  }
  #bar{
    height:1px; width:0%; margin-top:1px;
    background:linear-gradient(90deg, rgba(198,161,91,0.15), var(--brass));
  }

  /* ---------- stages / crossfade ---------- */
  .stage{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; transition:opacity 1.6s ease;
    padding:7vmin 6vmin;
  }
  .stage.visible{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    .stage{ transition:opacity 0.2s linear; }
  }

  .eyebrow{
    font-family:var(--utility); font-weight:400;
    font-size:1.7vmin; letter-spacing:0.42em; text-transform:uppercase;
    color:var(--brass); text-align:center;
    margin-bottom:4.5vmin;
  }
  .eyebrow .dim{ color:var(--smoke); }

  .caption{
    margin-top:4.5vmin; text-align:center; max-width:110vmin;
  }
  .caption .lede{
    font-family:var(--display); font-weight:400;
    font-size:3.4vmin; line-height:1.45; color:var(--vellum);
  }
  .caption .sub{
    margin-top:1.6vmin;
    font-family:var(--utility); font-weight:300;
    font-size:2vmin; letter-spacing:0.06em; color:var(--smoke);
  }

  /* ---------- concept card ---------- */
  .concept-title{
    font-family:var(--display); font-weight:500;
    font-size:11vmin; line-height:1.05; text-align:center;
    letter-spacing:0.01em; max-width:150vmin;
  }
  .concept-rule{
    width:9vmin; height:1px; background:var(--brass); opacity:0.7;
    margin:4vmin auto;
  }
  .concept-body{
    font-family:var(--display); font-weight:400;
    font-size:3.6vmin; line-height:1.55; text-align:center;
    color:var(--vellum); max-width:118vmin;
  }
  .concept-body em{ color:var(--brass); font-style:italic; }

  /* ---------- chess ---------- */
  .board{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    grid-template-rows:repeat(8, 1fr);
    width:56vmin; height:56vmin;
    border:1px solid rgba(198,161,91,0.5);
    box-shadow:0 0 12vmin rgba(0,0,0,0.6);
  }
  .sq{ display:flex; align-items:center; justify-content:center; position:relative; }
  .sq.light{ background:var(--board-light); }
  .sq.dark{ background:var(--board-dark); }
  .sq .coord{
    position:absolute; font-family:var(--utility); font-weight:400;
    font-size:1.35vmin; letter-spacing:0.05em; color:rgba(234,227,210,0.35);
  }
  .sq .coord.file{ right:0.5vmin; bottom:0.3vmin; }
  .sq .coord.rank{ left:0.5vmin; top:0.3vmin; }
  .pc{
    font-family:var(--pieces);
    font-size:5.6vmin; line-height:1;
    user-select:none;
  }
  .pc.w{ color:#EFE8D8; text-shadow:0 0 2px rgba(0,0,0,0.9), 0 1px 2px rgba(0,0,0,0.7); }
  .pc.b{ color:#14110D; text-shadow:0 0 2px rgba(234,227,210,0.5); }

  .solution{
    opacity:0; transition:opacity 1.4s ease;
    color:var(--brass); font-family:var(--display);
    font-size:3.2vmin; letter-spacing:0.04em; margin-top:1.4vmin;
  }
  .solution.shown{ opacity:1; }

  /* ---------- ambient ---------- */
  .ambient-canvas{ position:fixed; inset:0; z-index:1; }
  .ambient-word{
    position:relative; z-index:2;
    font-family:var(--display); font-weight:400;
    font-size:4vmin; letter-spacing:0.5em; text-transform:lowercase;
    color:rgba(234,227,210,0.55); text-align:center;
    padding-left:0.5em; /* balance letter-spacing */
  }

  #hint{
    position:fixed; bottom:4vmin; left:0; right:0; z-index:7;
    text-align:center; font-family:var(--utility); font-weight:300;
    font-size:1.8vmin; letter-spacing:0.18em; color:var(--smoke);
    opacity:0.85; transition:opacity 2s ease;
  }
  #hint.gone{ opacity:0; }

  body.hidecursor{ cursor:none; }
</style>
</head>
<body>

<div id="frame"></div>
<div id="clock"></div>
<div class="stage" id="stageA"></div>
<div class="stage" id="stageB"></div>
<div id="progress"><div id="bar"></div></div>
<div id="hint">→ next &nbsp;·&nbsp; ← back &nbsp;·&nbsp; space pause &nbsp;·&nbsp; S reveal solution</div>

<script>
'use strict';

/* ================= CONTENT ================= */

const PUZZLES = [
  { fen:'6k1/5ppp/8/8/8/8/8/4R2K w - - 0 1',
    task:'White to move — mate in 1',
    solution:'1. Re8#',
    note:'The back rank: the king’s own pawns become the walls of its prison.' },
  { fen:'6rk/6pp/8/4N3/8/8/8/7K w - - 0 1',
    task:'White to move — mate in 1',
    solution:'1. Nf7#',
    note:'A smothered mate — every escape square is occupied by the king’s own army.' },
  { fen:'7k/8/5K2/8/8/8/8/6Q1 w - - 0 1',
    task:'White to move — mate in 1',
    solution:'1. Qg7#',
    note:'The queen walks up under her king’s protection. The simplest machine in chess.' },
  { fen:'2r3k1/5ppp/8/8/8/4Q3/5PPP/4R1K1 w - - 0 1',
    task:'White to move — mate in 2',
    solution:'1. Qe8+! Rxe8  2. Rxe8#',
    note:'The queen is given away to drag the defender onto the fatal square.' },
  { fen:'7k/6p1/5N2/8/8/8/8/R4K2 w - - 0 1',
    task:'White to move — mate in 1',
    solution:'1. Rh1#',
    note:'The Arabian mate — one of the oldest recorded patterns, from 9th-century manuscripts.' },
  { fen:'k7/8/8/8/8/8/6R1/K6R w - - 0 1',
    task:'White to move — mate in 2',
    solution:'1. Rg7 Kb8  2. Rh8#',
    note:'The ladder mate: one rook seals the seventh rank, the other delivers on the eighth.' },
  { fen:'6k1/5ppp/8/8/8/8/1Q6/B5K1 w - - 0 1',
    task:'White to move — mate in 1',
    solution:'1. Qxg7#',
    note:'Battery on the long diagonal: the bishop behind makes the queen untouchable.' },
];
const CONCEPTS = [
  { tag:'Systems', title:'Blast radius',
    body:'Before asking whether a component can fail, ask what else burns when it does. Good architecture is mostly the art of <em>drawing smaller circles</em>.' },
  { tag:'Systems', title:'Time to live',
    body:'Nothing should be permanent by default. Access, records, automations — give each a clock, and let expiry do the housekeeping that humans forget.' },
  { tag:'Systems', title:'Idempotency',
    body:'An operation you can safely run twice is an operation you can safely retry. Most reliability engineering is just this idea, wearing different hats.' },
  { tag:'Systems', title:'Least privilege',
    body:'Grant the minimum needed to do the job, for the minimum time needed to do it. Not because people are untrustworthy — because <em>credentials leak</em>.' },
  { tag:'Electronics', title:'Parallel & series',
    body:'In parallel, every branch sees the full supply voltage and draws its own current. In series, one current flows through all — and one break darkens everything.' },
  { tag:'Electronics', title:'Why the fuse sits on the live wire',
    body:'A fuse on neutral still blows — but leaves the whole circuit sitting at full potential. Protection belongs <em>upstream of the danger</em>.' },
  { tag:'Electronics', title:'The residual-current device',
    body:'An RCD never measures how much current flows — only whether what leaves on live returns on neutral. A few milliamps of imbalance, and it opens in under 30 ms.' },
  { tag:'Electronics', title:'Ohm’s law',
    body:'V = I × R. Three quantities, one triangle — cover the one you want, and the other two tell you how to find it.' },
  { tag:'Chess', title:'Zugzwang',
    body:'A position where every legal move makes things worse — the obligation to act becomes the losing condition. German for “compulsion to move.”' },
  { tag:'Chess', title:'Prophylaxis',
    body:'Before improving your own position, ask what your opponent wants — and quietly take it away. The strongest moves often look like nothing happened.' },
  { tag:'Geography', title:'Chokepoints',
    body:'Roughly a fifth of the world’s oil passes through the Strait of Hormuz; a quarter of traded goods through Malacca. Geography still writes the rules of power.' },
  { tag:'Geography', title:'Exclave',
    body:'A territory separated from its motherland by other states — Kaliningrad, cut off from Russia by Lithuania and Poland, is Europe’s most consequential example.' },
  { tag:'Dansk', title:'Overskud',
    body:'Literally “surplus” — the spare mental energy to be patient, generous, or playful. You don’t <em>find</em> time for people; you need overskud for them.' },
  { tag:'Dansk', title:'Arbejdsglæde',
    body:'“Work-joy” — a single Danish word for finding genuine happiness in one’s work. Scandinavian languages have it; most others need a sentence.' },
  { tag:'Dansk', title:'Fingerspidsfornemmelse',
    body:'“Fingertip-feeling” — the intuitive touch for a delicate situation that no rulebook can teach. Knowing exactly how far to go, and no further.' },
  { tag:'Thinking', title:'Chesterton’s fence',
    body:'Never remove a fence until you know why it was put up. Reforms made in ignorance of a rule’s purpose tend to rediscover that purpose the hard way.' },
  { tag:'Thinking', title:'Goodhart’s law',
    body:'When a measure becomes a target, it ceases to be a good measure. People don’t optimize what you want — they optimize what you <em>count</em>.' },
];

const AMBIENT_WORDS = ['stilhed','tænkepause','nightfall','interlude','ro'];

/* ================= UTILITIES ================= */

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pool(items){
  let bag = shuffle(items);
  return () => { if(!bag.length) bag = shuffle(items); return bag.pop(); };
}
const nextPuzzle = pool(PUZZLES);
const nextConcept = pool(CONCEPTS);

const GLYPH = { K:'\u2654',Q:'\u2655',R:'\u2656',B:'\u2657',N:'\u2658',P:'\u2659',
                k:'\u265A',q:'\u265B',r:'\u265C',b:'\u265D',n:'\u265E',p:'\u265F' };

function buildBoard(fen){
  const board = document.createElement('div');
  board.className = 'board';
  const rows = fen.split(' ')[0].split('/');
  for(let r=0;r<8;r++){
    let file = 0;
    const cells = [];
    for(const ch of rows[r]){
      if(/\d/.test(ch)){ for(let i=0;i<+ch;i++){ cells.push(null); } }
      else cells.push(ch);
    }
    for(let f=0;f<8;f++){
      const sq = document.createElement('div');
      sq.className = 'sq ' + (((r+f)%2===0)?'light':'dark');
      const piece = cells[f];
      if(piece){
        const span = document.createElement('span');
        span.className = 'pc ' + (piece===piece.toUpperCase()?'w':'b');
        span.textContent = GLYPH[piece] + '\uFE0E';
        sq.appendChild(span);
      }
      if(r===7){ const c=document.createElement('span'); c.className='coord file'; c.textContent='abcdefgh'[f]; sq.appendChild(c); }
      if(f===0){ const c=document.createElement('span'); c.className='coord rank'; c.textContent=String(8-r); sq.appendChild(c); }
      board.appendChild(sq);
    }
  }
  return board;
}

/* ================= CARD RENDERERS ================= */
/* each returns { node, duration(s), onEnter?, onExit?, reveal? } */

function cardPuzzle(){
  const p = nextPuzzle();
  const node = document.createElement('div');
  node.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
  const eyebrow = document.createElement('div');
  eyebrow.className='eyebrow';
  eyebrow.innerHTML = 'Tactics <span class="dim">·</span> ' + p.task;
  const caption = document.createElement('div');
  caption.className='caption';
  const sol = document.createElement('div');
  sol.className='solution';
  sol.textContent = p.solution;
  const sub = document.createElement('div');
  sub.className='sub';
  sub.style.cssText='font-family:var(--utility);font-weight:300;font-size:2vmin;letter-spacing:0.06em;color:var(--smoke);margin-top:1.4vmin;';
  sub.textContent = p.note;
  caption.appendChild(sol); caption.appendChild(sub);

  node.appendChild(eyebrow);
  node.appendChild(buildBoard(p.fen));
  node.appendChild(caption);

  let timer = null;
  const reveal = () => sol.classList.add('shown');
  return {
    node, duration: 300,
    onEnter(){ timer = setTimeout(reveal, 240000); },
    onExit(){ clearTimeout(timer); },
    reveal
  };
}

function cardConcept(){
  const c = nextConcept();
  const node = document.createElement('div');
  const eyebrow = document.createElement('div');
  eyebrow.className='eyebrow';
  eyebrow.textContent = c.tag;
  const title = document.createElement('div');
  title.className='concept-title';
  title.textContent = c.title;
  const rule = document.createElement('div');
  rule.className='concept-rule';
  const body = document.createElement('div');
  body.className='concept-body';
  body.innerHTML = c.body;
  node.appendChild(eyebrow); node.appendChild(title); node.appendChild(rule); node.appendChild(body);
  return { node, duration: 150 };
}

function cardAmbient(){
  const node = document.createElement('div');
  const canvas = document.createElement('canvas');
  canvas.className='ambient-canvas';
  const word = document.createElement('div');
  word.className='ambient-word';
  word.textContent = AMBIENT_WORDS[Math.floor(Math.random()*AMBIENT_WORDS.length)];
  node.appendChild(canvas); node.appendChild(word);

  let raf = null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function start(){
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = innerWidth; canvas.height = innerHeight; };
    resize();
    const blobs = [];
    const palette = ['198,161,91','94,107,102','120,90,60','60,70,90'];
    for(let i=0;i<5;i++){
      blobs.push({
        x:Math.random(), y:Math.random(),
        r:0.28+Math.random()*0.25,
        dx:(Math.random()*2-1)*0.00002, dy:(Math.random()*2-1)*0.000015,
        ph:Math.random()*Math.PI*2,
        col:palette[i%palette.length]
      });
    }
    let t = 0;
    function frame(){
      t += 1;
      ctx.fillStyle = 'rgba(12,10,7,0.35)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(const b of blobs){
        b.x += b.dx*canvas.width*0.02 + Math.sin(t*0.002+b.ph)*0.00008;
        b.y += b.dy*canvas.height*0.02 + Math.cos(t*0.0017+b.ph)*0.00006;
        if(b.x<-0.3) b.x=1.3; if(b.x>1.3) b.x=-0.3;
        if(b.y<-0.3) b.y=1.3; if(b.y>1.3) b.y=-0.3;
        const R = b.r*Math.min(canvas.width,canvas.height);
        const g = ctx.createRadialGradient(b.x*canvas.width,b.y*canvas.height,0,b.x*canvas.width,b.y*canvas.height,R);
        const pulse = 0.05 + 0.02*Math.sin(t*0.004+b.ph);
        g.addColorStop(0,'rgba('+b.col+','+pulse+')');
        g.addColorStop(1,'rgba('+b.col+',0)');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
      raf = requestAnimationFrame(frame);
    }
    if(reduced){
      /* single static wash */
      ctx.fillStyle = '#0C0A07'; ctx.fillRect(0,0,canvas.width,canvas.height);
      for(const b of blobs){
        const R = b.r*Math.min(canvas.width,canvas.height);
        const g = ctx.createRadialGradient(b.x*canvas.width,b.y*canvas.height,0,b.x*canvas.width,b.y*canvas.height,R);
        g.addColorStop(0,'rgba('+b.col+',0.06)'); g.addColorStop(1,'rgba('+b.col+',0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
      }
    } else {
      frame();
    }
  }
  return {
    node, duration: 120,
    onEnter(){ start(); },
    onExit(){ if(raf) cancelAnimationFrame(raf); }
  };
}

/* ================= ROTATION ENGINE ================= */

const SEQUENCE = [cardPuzzle, cardConcept, cardConcept, cardAmbient];
let seqIndex = 0;

const stages = [document.getElementById('stageA'), document.getElementById('stageB')];
let activeStage = 0;
let current = null;
let history = [];

let cardStart = 0;      // performance.now() at card start
let cardDuration = 0;   // ms
let paused = false;
let pausedElapsed = 0;

const bar = document.getElementById('bar');

function showCard(maker){
  const next = maker();
  const incoming = stages[1-activeStage];
  const outgoing = stages[activeStage];

  incoming.innerHTML = '';
  incoming.appendChild(next.node);
  incoming.classList.add('visible');
  outgoing.classList.remove('visible');

  const prev = current;
  setTimeout(() => {
    if(!outgoing.classList.contains('visible')) outgoing.innerHTML = '';
    if(prev && prev.onExit) prev.onExit();
  }, 1700);

  activeStage = 1-activeStage;
  current = next;
  if(next.onEnter) next.onEnter();

  cardDuration = next.duration*1000;
  cardStart = performance.now();
  pausedElapsed = 0;
}

function advance(step){
  if(step === -1 && history.length > 1){
    history.pop();                       // drop current
    const makerIdx = history[history.length-1];
    showCard(SEQUENCE[makerIdx]);
    seqIndex = (makerIdx+1) % SEQUENCE.length;
    return;
  }
  const idx = seqIndex;
  history.push(idx);
  if(history.length>40) history.shift();
  seqIndex = (seqIndex+1) % SEQUENCE.length;
  showCard(SEQUENCE[idx]);
}

function tick(now){
  if(!paused && current){
    const elapsed = now - cardStart;
    const frac = Math.min(1, elapsed/cardDuration);
    bar.style.width = (frac*100)+'%';
    if(frac >= 1) advance(1);
  }
  requestAnimationFrame(tick);
}

/* ================= CLOCK ================= */
const clockEl = document.getElementById('clock');
function updateClock(){
  const d = new Date();
  clockEl.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

/* ================= CONTROLS ================= */
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight'){ advance(1); }
  else if(e.key === 'ArrowLeft'){ advance(-1); }
  else if(e.key === ' '){
    e.preventDefault();
    if(!paused){ paused = true; pausedElapsed = performance.now()-cardStart; }
    else { paused = false; cardStart = performance.now()-pausedElapsed; }
  }
  else if(e.key === 's' || e.key === 'S'){
    if(current && current.reveal) current.reveal();
  }
});

/* hide cursor + hint after idle */
let cursorTimer = null;
function poke(){
  document.body.classList.remove('hidecursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(()=>document.body.classList.add('hidecursor'), 3000);
}
document.addEventListener('mousemove', poke); poke();
setTimeout(()=>document.getElementById('hint').classList.add('gone'), 14000);

/* ================= GO ================= */
advance(1);
requestAnimationFrame(tick);
</script>
</body>
</html>
